[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "trading-alert-platform"
version = "0.1.0"
description = "Trading Alert Platform shadow worker"
requires-python = ">=3.10"
dependencies = [
  "exchange-calendars>=4.5,<5",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
