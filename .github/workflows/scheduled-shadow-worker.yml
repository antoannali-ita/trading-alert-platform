name: Production Alert Worker

on:
  workflow_dispatch:
    inputs:
      create_e2e_test_alert:
        description: Create a guaranteed AAPL E2E test alert
        required: false
        default: 'false'
        type: choice
        options: ['false', 'true']
  push:
    branches: [main]
    paths:
      - '.github/workflows/scheduled-shadow-worker.yml'
  schedule:
    - cron: '2-57/5 * * * *'

permissions:
  contents: read
  issues: write

concurrency:
  group: production-alert-worker
  cancel-in-progress: false

jobs:
  alerts:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
      WHATSAPP_NUMBER: ${{ secrets.WHATSAPP_NUMBER }}
      CALLMEBOT_APIKEY: ${{ secrets.CALLMEBOT_APIKEY }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      GMAIL_SENDER: ${{ secrets.GMAIL_SENDER }}
      GMAIL_RECIPIENT: ${{ secrets.GMAIL_RECIPIENT }}
      GMAIL_PASSWORD: ${{ secrets.GMAIL_PASSWORD }}
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install worker
        run: python -m pip install -e .

      - name: Validate core secrets
        shell: bash
        run: |
          set -euo pipefail
          test -n "${SUPABASE_URL:-}"
          test -n "${SUPABASE_SECRET_KEY:-}"
          test -n "${TWELVE_DATA_API_KEY:-}"

      - name: Create guaranteed E2E test alert
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.create_e2e_test_alert == 'true')
        shell: bash
        run: |
          python - <<'PY'
          import json, os, urllib.request
          from datetime import datetime, timedelta, timezone
          marker = "E2E_TEST_" + datetime.now(timezone.utc).strftime("%Y%m%dT%H%M%SZ")
          body = json.dumps({
              "ticker": "AAPL",
              "market": "USA",
              "alert_type": "PRICE_ABOVE",
              "condition": marker + " guaranteed crossing; not an investment signal",
              "threshold": 0.01,
              "status": "ACTIVE",
              "priority": 100,
              "trigger_confirmation": "INSTANT",
              "notification_policy": "BUY_PREBUY_HIGH",
              "valid_until": (datetime.now(timezone.utc) + timedelta(minutes=30)).isoformat(),
              "next_check_at": datetime.now(timezone.utc).isoformat()
          }).encode()
          req = urllib.request.Request(
              os.environ["SUPABASE_URL"].rstrip("/") + "/rest/v1/alerts",
              data=body, method="POST",
              headers={
                  "apikey": os.environ["SUPABASE_SECRET_KEY"],
                  "Authorization": "Bearer " + os.environ["SUPABASE_SECRET_KEY"],
                  "Content-Type": "application/json",
                  "Content-Profile": "alert_platform",
                  "Prefer": "return=representation"
              })
          with urllib.request.urlopen(req, timeout=30) as response:
              row = json.load(response)[0]
          print("E2E_ALERT_CREATED id=" + row["id"] + " marker=" + marker)
          PY

      - name: Run production alert cycle with multichannel delivery
        shell: bash
        run: |
          python - <<'PY'
          import json, os, smtplib, ssl, urllib.parse, urllib.request
          from datetime import datetime, timezone
          from email.message import EmailMessage
          from alert_platform.market_calendar import ExchangeMarketCalendar
          from alert_platform.provider_manager import ProviderManager
          from alert_platform.providers.twelve_data import TwelveDataProvider
          from alert_platform.providers.yahoo import YahooProvider
          from alert_platform.live_worker import run_live_cycle
          from alert_platform.supabase_repo import SupabaseAlertRepository, SupabaseCreditBudget, SupabaseSettings
          from alert_platform.whatsapp import send_callmebot

          def telegram(message):
              token=os.environ.get("TELEGRAM_BOT_TOKEN","").strip()
              if not token: raise RuntimeError("TELEGRAM_BOT_TOKEN_MISSING")
              chat_id=os.environ.get("TELEGRAM_CHAT_ID","").strip()
              base=f"https://api.telegram.org/bot{token}"
              if not chat_id:
                  with urllib.request.urlopen(base+"/getUpdates",timeout=30) as r: updates=json.load(r)
                  chats=[]
                  for update in updates.get("result",[]):
                      msg=update.get("message") or update.get("edited_message") or {}
                      chat=msg.get("chat") or {}
                      if chat.get("type")=="private" and chat.get("id") is not None: chats.append(str(chat["id"]))
                  if not chats: raise RuntimeError("TELEGRAM_CHAT_NOT_FOUND")
                  chat_id=chats[-1]
              data=urllib.parse.urlencode({"chat_id":chat_id,"text":message}).encode()
              with urllib.request.urlopen(urllib.request.Request(base+"/sendMessage",data=data,method="POST"),timeout=30) as r:
                  payload=json.load(r)
              if not payload.get("ok"): raise RuntimeError("TELEGRAM_SEND_FAILED")
              return "DELIVERED"

          def email(message):
              sender=os.environ.get("GMAIL_SENDER","").strip()
              recipient=os.environ.get("GMAIL_RECIPIENT","").strip()
              password=os.environ.get("GMAIL_PASSWORD","").strip()
              if not sender or not recipient or not password: raise RuntimeError("GMAIL_SECRETS_MISSING")
              msg=EmailMessage(); msg["Subject"]="ALERT | Trading Alert Platform"; msg["From"]=sender; msg["To"]=recipient
              msg.set_content(message + "\n\nTest tecnico; non è un segnale di investimento.")
              with smtplib.SMTP("smtp.gmail.com",587,timeout=30) as smtp:
                  smtp.ehlo(); smtp.starttls(context=ssl.create_default_context()); smtp.ehlo()
                  smtp.login(sender,password); smtp.send_message(msg)
              return "DELIVERED"

          def dispatch(message):
              results={}; successes=0
              for channel, fn in (
                  ("telegram", lambda: telegram(message)),
                  ("email", lambda: email(message)),
                  ("callmebot", lambda: send_callmebot(os.environ.get("WHATSAPP_NUMBER",""),os.environ.get("CALLMEBOT_APIKEY",""),message)),
              ):
                  try:
                      results[channel]=fn(); successes+=1
                  except Exception as exc:
                      results[channel]="FAILED_"+type(exc).__name__+":"+str(exc)
              print("CHANNEL_RESULTS="+json.dumps(results,sort_keys=True))
              if not successes: raise RuntimeError("ALL_CHANNELS_FAILED")
              return json.dumps(results)

          repo=SupabaseAlertRepository(SupabaseSettings(os.environ["SUPABASE_URL"],os.environ["SUPABASE_SECRET_KEY"]))
          budget=SupabaseCreditBudget(repo,per_minute_limit=8,daily_budget=800)
          provider=ProviderManager(TwelveDataProvider(os.environ["TWELVE_DATA_API_KEY"]),YahooProvider(),budget=budget)
          result=run_live_cycle(repo,ExchangeMarketCalendar(refresh_delay_minutes=3),provider,dispatch,now=datetime.now(timezone.utc))
          print(result)
          if result.errors: raise SystemExit(f"PRODUCTION_ALERT_ERRORS={result.errors} last={result.last_error}")
          print("PRODUCTION_ALERT_CYCLE_OK")
          PY

      - name: Publish verification issue
        if: always() && github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create --title "E2E alert verification ${{ job.status }}" --body "Run: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}\nCommit: ${{ github.sha }}\nCheck CHANNEL_RESULTS in logs."
