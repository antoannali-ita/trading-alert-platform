name: Production Alert Worker

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/scheduled-shadow-worker.yml'
  schedule:
    - cron: '2-57/5 * * * *'

permissions:
  contents: read
  issues: write

concurrency:
  group: production-alert-worker
  cancel-in-progress: false

jobs:
  alerts:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
      WHATSAPP_NUMBER: ${{ secrets.WHATSAPP_NUMBER }}
      CALLMEBOT_APIKEY: ${{ secrets.CALLMEBOT_APIKEY }}
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install worker
        run: python -m pip install -e .

      - name: Apply production cutover on deployment
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          test -n "${SUPABASE_DB_URL:-}"
          psql "${SUPABASE_DB_URL}" -v ON_ERROR_STOP=1 \
            -f supabase/migrations/20260902_001_production_cutover.sql

      - name: Validate secrets
        shell: bash
        run: |
          set -euo pipefail
          test -n "${SUPABASE_URL:-}"
          test -n "${SUPABASE_SECRET_KEY:-}"
          test -n "${TWELVE_DATA_API_KEY:-}"
          test -n "${WHATSAPP_NUMBER:-}"
          test -n "${CALLMEBOT_APIKEY:-}"

      - name: Smoke-test market data providers
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import os

          from alert_platform.providers.twelve_data import TwelveDataProvider
          from alert_platform.providers.yahoo import YahooProvider

          providers = (
              ('TWELVE_DATA', TwelveDataProvider(os.environ['TWELVE_DATA_API_KEY'])),
              ('YAHOO', YahooProvider()),
          )
          available = 0
          for name, provider in providers:
              try:
                  prices = tuple(provider.get_prices(('AAPL',)))
                  if not prices:
                      raise RuntimeError('empty response')
                  quote = prices[0]
                  print(f"MARKET_DATA_SMOKE_OK provider={name} symbol={quote.ticker} timestamp={quote.timestamp.isoformat()}")
                  available += 1
              except Exception as exc:
                  print(f"MARKET_DATA_SMOKE_FAILED provider={name} error={type(exc).__name__}: {exc}")
          if available == 0:
              raise SystemExit('NO_MARKET_DATA_PROVIDER_AVAILABLE')
          PY

      - name: End-to-end WhatsApp notification test
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          echo "ALERT_COUNTS_BEGIN"
          psql "${SUPABASE_DB_URL}" -v ON_ERROR_STOP=1 -P pager=off -c "
            select market, status, count(*) as total,
                   count(*) filter (where next_check_at <= now()) as due,
                   count(*) filter (where valid_until > now()) as valid
              from alert_platform.alerts
             group by market, status
             order by market, status;"
          echo "ACTIVE_ALERTS_BEGIN"
          psql "${SUPABASE_DB_URL}" -v ON_ERROR_STOP=1 -P pager=off -c "
            select ticker, market, alert_type, threshold, threshold_min, threshold_max,
                   status, next_check_at, valid_until
              from alert_platform.alerts
             where status in ('ACTIVE','CLAIMED')
             order by market, priority desc, next_check_at
             limit 50;"

          psql "${SUPABASE_DB_URL}" -v ON_ERROR_STOP=1 -c "
            update alert_platform.alerts
               set status = 'CANCELLED', updated_at = now()
             where condition = 'E2E_WHATSAPP_TEST'
               and status in ('ACTIVE','CLAIMED');"

          TEST_TICKER=$(psql "${SUPABASE_DB_URL}" -v ON_ERROR_STOP=1 -Atc "
            select ticker
              from alert_platform.alerts
             where market = 'ITALIA'
               and status = 'ACTIVE'
               and valid_until > now()
             order by priority desc, created_at
             limit 1;")
          TEST_TICKER="${TEST_TICKER:-ENEL.MI}"
          TEST_ALERT_ID=$(psql "${SUPABASE_DB_URL}" -v ON_ERROR_STOP=1 -Atc "
            insert into alert_platform.alerts (
              ticker, market, alert_type, condition, threshold, status,
              priority, trigger_confirmation, notification_policy,
              valid_until, next_check_at
            ) values (
              '${TEST_TICKER}', 'ITALIA', 'PRICE_ABOVE', 'E2E_WHATSAPP_TEST',
              0.01, 'ACTIVE', 100, 'INSTANT', 'BUY_PREBUY_HIGH',
              now() + interval '30 minutes', now()
            )
            returning id;")
          export TEST_ALERT_ID
          echo "E2E_TEST_CREATED id=${TEST_ALERT_ID} ticker=${TEST_TICKER}"

          python - <<'PY'
          import os
          from datetime import datetime, timezone
          from decimal import Decimal

          from alert_platform.market_calendar import ExchangeMarketCalendar
          from alert_platform.market_data import MarketPrice
          from alert_platform.live_worker import run_live_cycle
          from alert_platform.supabase_repo import (
              SupabaseAlertRepository,
              SupabaseCreditBudget,
              SupabaseSettings,
          )
          from alert_platform.whatsapp import send_callmebot

          repo = SupabaseAlertRepository(
              SupabaseSettings(
                  os.environ['SUPABASE_URL'],
                  os.environ['SUPABASE_SECRET_KEY'],
              )
          )
          class SyntheticMarketData:
              def get_prices(self, symbols):
                  now = datetime.now(timezone.utc)
                  return tuple(
                      MarketPrice(
                          ticker=symbol,
                          price=Decimal('100.00'),
                          timestamp=now,
                          market_status='OPEN',
                          provider='E2E_SYNTHETIC',
                          data_quality='TEST',
                      )
                      for symbol in symbols
                  )

          result = run_live_cycle(
              repo,
              ExchangeMarketCalendar(refresh_delay_minutes=3),
              SyntheticMarketData(),
              lambda message: send_callmebot(
                  os.environ['WHATSAPP_NUMBER'],
                  os.environ['CALLMEBOT_APIKEY'],
                  "TEST END-TO-END - " + message,
              ),
              now=datetime.now(timezone.utc),
          )
          print(f"E2E_LIVE_RESULT={result}")
          if result.errors:
              raise SystemExit(f"E2E_ALERT_ERRORS={result.errors}")
          PY

          TEST_STATUS=$(psql "${SUPABASE_DB_URL}" -v ON_ERROR_STOP=1 -Atc "
            select status::text
              from alert_platform.alerts
             where id = '${TEST_ALERT_ID}'::uuid;")
          echo "E2E_TEST_STATUS=${TEST_STATUS}"
          test "${TEST_STATUS}" = "TRIGGERED"

      - name: Run production alert cycle
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          from datetime import datetime, timezone

          from alert_platform.market_calendar import ExchangeMarketCalendar
          from alert_platform.provider_manager import ProviderManager
          from alert_platform.providers.twelve_data import TwelveDataProvider
          from alert_platform.providers.yahoo import YahooProvider
          from alert_platform.live_worker import run_live_cycle
          from alert_platform.supabase_repo import (
              SupabaseAlertRepository,
              SupabaseCreditBudget,
              SupabaseSettings,
          )
          from alert_platform.whatsapp import send_callmebot

          repo = SupabaseAlertRepository(
              SupabaseSettings(
                  os.environ['SUPABASE_URL'],
                  os.environ['SUPABASE_SECRET_KEY'],
              )
          )
          budget = SupabaseCreditBudget(repo, per_minute_limit=8, daily_budget=800)
          provider = ProviderManager(
              TwelveDataProvider(os.environ['TWELVE_DATA_API_KEY']),
              YahooProvider(),
              budget=budget,
          )
          result = run_live_cycle(
              repo, ExchangeMarketCalendar(refresh_delay_minutes=3), provider,
              lambda message: send_callmebot(
                  os.environ['WHATSAPP_NUMBER'], os.environ['CALLMEBOT_APIKEY'], message
              ),
              now=datetime.now(timezone.utc),
          )
          print(result)
          if result.errors:
              raise SystemExit(f"PRODUCTION_ALERT_ERRORS={result.errors}")
          print('PRODUCTION_ALERT_CYCLE_OK')
          PY

      - name: Publish cutover verification
        if: always() && github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create \
            --title "Alert cutover verification ${{ job.status }}" \
            --body "Workflow run: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}\nCommit: ${{ github.sha }}\nResult: ${{ job.status }}"
