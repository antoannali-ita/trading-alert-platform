name: Production Alert Worker

on:
  workflow_dispatch:
    inputs:
      create_e2e_test_alert:
        description: Create a guaranteed AAPL E2E test alert
        required: false
        default: 'false'
        type: choice
        options: ['false', 'true']
  push:
    branches: [main]
    paths:
      - '.github/workflows/scheduled-shadow-worker.yml'
  schedule:
    - cron: '2-57/5 * * * *'

permissions:
  contents: read
  issues: write

concurrency:
  group: production-alert-worker
  cancel-in-progress: false

jobs:
  alerts:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
      WHATSAPP_NUMBER: ${{ secrets.WHATSAPP_NUMBER }}
      CALLMEBOT_APIKEY: ${{ secrets.CALLMEBOT_APIKEY }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      GMAIL_SENDER: ${{ secrets.GMAIL_SENDER }}
      GMAIL_RECIPIENT: ${{ secrets.GMAIL_RECIPIENT }}
      GMAIL_PASSWORD: ${{ secrets.GMAIL_PASSWORD }}
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install worker
        run: python -m pip install -e .

      - name: Validate core secrets
        shell: bash
        run: |
          set -euo pipefail
          test -n "${SUPABASE_URL:-}"
          test -n "${SUPABASE_SECRET_KEY:-}"
          test -n "${TWELVE_DATA_API_KEY:-}"
          if [ -z "${WHATSAPP_NUMBER:-}" ] || [ -z "${CALLMEBOT_APIKEY:-}" ]; then
            echo "::warning::WhatsApp secrets missing"
          fi
          if [ -z "${TELEGRAM_BOT_TOKEN:-}" ] || [ -z "${TELEGRAM_CHAT_ID:-}" ]; then
            echo "::warning::Telegram incomplete: TELEGRAM_BOT_TOKEN/TELEGRAM_CHAT_ID"
          fi

      - name: Create guaranteed E2E test alert
        if: github.event_name == 'workflow_dispatch' && inputs.create_e2e_test_alert == 'true'
        shell: bash
        run: |
          python - <<'PY'
          import json, os, urllib.error, urllib.request
          from datetime import datetime, timedelta, timezone
          marker = "E2E_TEST_" + datetime.now(timezone.utc).strftime("%Y%m%dT%H%M%SZ")
          body = json.dumps({
              "ticker": "AAPL",
              "market": "USA",
              "alert_type": "RESISTANCE",
              "condition": marker + " guaranteed crossing; not an investment signal",
              "threshold": 0.01,
              "status": "ACTIVE",
              "priority": 100,
              "trigger_confirmation": "INSTANT",
              "notification_policy": "BUY_PREBUY_HIGH",
              "valid_until": (datetime.now(timezone.utc) + timedelta(minutes=30)).isoformat(),
              "next_check_at": datetime.now(timezone.utc).isoformat()
          }).encode()
          req = urllib.request.Request(
              os.environ["SUPABASE_URL"].rstrip("/") + "/rest/v1/alerts",
              data=body, method="POST",
              headers={
                  "apikey": os.environ["SUPABASE_SECRET_KEY"],
                  "Authorization": "Bearer " + os.environ["SUPABASE_SECRET_KEY"],
                  "Content-Type": "application/json",
                  "Content-Profile": "alert_platform",
                  "Prefer": "return=representation"
              })
          try:
              with urllib.request.urlopen(req, timeout=30) as response:
                  row = json.load(response)[0]
              print("E2E_ALERT_CREATED id=" + row["id"] + " marker=" + marker)
          except urllib.error.HTTPError as exc:
              if exc.code != 409:
                  raise
              print("E2E_ALERT_REUSED existing equivalent active alert")
          PY

      - name: Run production alert cycle with multichannel delivery
        shell: bash
        run: |
          python - <<'PY'
          import json, os, smtplib, ssl, urllib.parse, urllib.request
          from datetime import datetime, timezone
          from email.message import EmailMessage
          from alert_platform.market_calendar import ExchangeMarketCalendar
          from alert_platform.provider_manager import ProviderManager
          from alert_platform.providers.twelve_data import TwelveDataProvider
          from alert_platform.providers.yahoo import YahooProvider
          from alert_platform.live_worker import run_live_cycle
          from alert_platform.supabase_repo import SupabaseAlertRepository, SupabaseSettings
          from alert_platform.whatsapp import send_callmebot

          def telegram(message):
              token=os.environ.get("TELEGRAM_BOT_TOKEN","").strip()
              chat_id=os.environ.get("TELEGRAM_CHAT_ID","").strip()
              if not token or not chat_id:
                  return "SKIPPED_NOT_CONFIGURED"
              base=f"https://api.telegram.org/bot{token}"
              data=urllib.parse.urlencode({"chat_id":chat_id,"text":message}).encode()
              with urllib.request.urlopen(urllib.request.Request(base+"/sendMessage",data=data,method="POST"),timeout=30) as r:
                  payload=json.load(r)
              if not payload.get("ok"): raise RuntimeError("TELEGRAM_SEND_FAILED")
              return "DELIVERED"

          def email(message):
              sender=os.environ.get("GMAIL_SENDER","").strip()
              recipient=os.environ.get("GMAIL_RECIPIENT","").strip()
              password=os.environ.get("GMAIL_PASSWORD","").strip()
              if not sender or not recipient or not password:
                  return "SKIPPED_NOT_CONFIGURED"
              msg=EmailMessage(); msg["Subject"]="ALERT | Trading Alert Platform"; msg["From"]=sender; msg["To"]=recipient
              msg.set_content(message + "\n\nTest tecnico; non è un segnale di investimento.")
              with smtplib.SMTP("smtp.gmail.com",587,timeout=30) as smtp:
                  smtp.ehlo(); smtp.starttls(context=ssl.create_default_context()); smtp.ehlo()
                  smtp.login(sender,password); smtp.send_message(msg)
              return "DELIVERED"

          def callmebot(message):
              phone=os.environ.get("WHATSAPP_NUMBER","").strip()
              key=os.environ.get("CALLMEBOT_APIKEY","").strip()
              if not phone or not key:
                  return "SKIPPED_NOT_CONFIGURED"
              return send_callmebot(phone,key,message)

          def dispatch(message):
              results={}; successes=0
              for channel, fn in (
                  ("telegram", lambda: telegram(message)),
                  ("email", lambda: email(message)),
                  ("callmebot", lambda: callmebot(message)),
              ):
                  try:
                      result=fn(); results[channel]=result
                      if not str(result).startswith("SKIPPED_"):
                          successes+=1
                  except Exception as exc:
                      results[channel]="FAILED_"+type(exc).__name__+":"+str(exc)
              print("CHANNEL_RESULTS="+json.dumps(results,sort_keys=True))
              if not successes:
                  raise RuntimeError("ALL_CONFIGURED_CHANNELS_FAILED_OR_MISSING")
              return json.dumps(results,sort_keys=True)

          repo=SupabaseAlertRepository(SupabaseSettings(os.environ["SUPABASE_URL"],os.environ["SUPABASE_SECRET_KEY"]))
          # Yahoo is temporarily primary because delayed Twelve Data timestamps
          # are rejected by the 180-second production freshness gate.
          provider=ProviderManager(YahooProvider(),TwelveDataProvider(os.environ["TWELVE_DATA_API_KEY"]),primary_name="YAHOO")
          result=run_live_cycle(repo,ExchangeMarketCalendar(refresh_delay_minutes=3),provider,dispatch,now=datetime.now(timezone.utc))
          print(result)
          for detail in result.error_details:
              print("ALERT_DIAGNOSTIC="+detail)

          is_e2e = os.environ.get("E2E_REQUIRED") == "true"
          if is_e2e and result.sent < 1:
              raise SystemExit(f"E2E_DELIVERY_NOT_PROVEN claimed={result.claimed} checked={result.checked} triggered={result.triggered} sent={result.sent} errors={result.errors}")
          if result.claimed > 0 and result.checked == 0:
              raise SystemExit(f"PRODUCTION_ALERTS_UNCHECKED claimed={result.claimed} errors={result.errors} last={result.last_error}")
          if result.errors:
              print(f"::warning::PRODUCTION_ALERT_PARTIAL_ERRORS={result.errors} last={result.last_error}")
          print("PRODUCTION_ALERT_CYCLE_OK")
          PY
        env:
          E2E_REQUIRED: ${{ github.event_name == 'workflow_dispatch' && inputs.create_e2e_test_alert == 'true' }}

      - name: Publish verification issue
        if: always() && github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create --title "Alert worker verification ${{ job.status }}" --body "Run: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}\nCommit: ${{ github.sha }}\nCheck CHANNEL_RESULTS and ALERT_DIAGNOSTIC in logs."
