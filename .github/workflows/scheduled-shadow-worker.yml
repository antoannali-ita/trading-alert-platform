name: Scheduled Shadow Worker

on:
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'

permissions:
  contents: read

concurrency:
  group: scheduled-shadow-worker
  cancel-in-progress: false

jobs:
  shadow:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install worker
        run: python -m pip install -e .

      - name: Validate secrets
        shell: bash
        run: |
          set -euo pipefail
          test -n "${SUPABASE_URL:-}"
          test -n "${SUPABASE_SECRET_KEY:-}"
          test -n "${TWELVE_DATA_API_KEY:-}"

      - name: Run scheduled SHADOW cycle
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          from datetime import datetime, timezone

          from alert_platform.market_calendar import ExchangeMarketCalendar
          from alert_platform.provider_manager import ProviderManager
          from alert_platform.providers.twelve_data import TwelveDataProvider
          from alert_platform.providers.yahoo import YahooProvider
          from alert_platform.scheduled_worker import run_scheduled_shadow_cycle
          from alert_platform.supabase_repo import (
              SupabaseAlertRepository,
              SupabaseCreditBudget,
              SupabaseSettings,
          )
          from alert_platform.worker import WorkerConfig

          repo = SupabaseAlertRepository(
              SupabaseSettings(
                  os.environ['SUPABASE_URL'],
                  os.environ['SUPABASE_SECRET_KEY'],
              )
          )
          budget = SupabaseCreditBudget(repo, per_minute_limit=8, daily_budget=800)
          provider = ProviderManager(
              TwelveDataProvider(os.environ['TWELVE_DATA_API_KEY']),
              YahooProvider(),
              budget=budget,
          )
          result = run_scheduled_shadow_cycle(
              repo,
              calendar=ExchangeMarketCalendar(refresh_delay_minutes=3),
              market_data=provider,
              worker_config=WorkerConfig(
                  claim_limit=100,
                  enable_market_data=True,
                  enable_auto_trigger=False,
                  enable_v3=False,
                  send_whatsapp=False,
              ),
              now=datetime.now(timezone.utc),
          )

          print({
              'blocked_markets': result.blocked_markets,
              'refresh': [
                  {
                      'status': r.status,
                      'seeded': r.seeded,
                      'claimed_items': r.claimed_items,
                      'updated': r.updated,
                      'degraded': r.degraded,
                      'pending_open': r.pending_open,
                      'no_open_data': r.no_open_data,
                      'failed': r.failed,
                      'pending_remaining': r.pending_remaining,
                  }
                  for r in result.refresh_results
              ],
              'adaptive': {
                  'status': result.adaptive_result.status,
                  'claimed': result.adaptive_result.claimed,
                  'unique_tickers': result.adaptive_result.unique_tickers,
                  'valid_prices': result.adaptive_result.valid_prices,
                  'invalid_prices': result.adaptive_result.invalid_prices,
                  'released': result.adaptive_result.released,
              },
          })
          print('SCHEDULED_SHADOW_CYCLE_OK')
          PY
