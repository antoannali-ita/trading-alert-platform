name: Production Alert Worker

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/scheduled-shadow-worker.yml'
  schedule:
    - cron: '2-57/5 * * * *'

permissions:
  contents: read
  issues: write

concurrency:
  group: production-alert-worker
  cancel-in-progress: false

jobs:
  alerts:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
      WHATSAPP_NUMBER: ${{ secrets.WHATSAPP_NUMBER }}
      CALLMEBOT_APIKEY: ${{ secrets.CALLMEBOT_APIKEY }}
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install worker
        run: python -m pip install -e .

      - name: Apply production cutover on deployment
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          test -n "${SUPABASE_DB_URL:-}"
          psql "${SUPABASE_DB_URL}" -v ON_ERROR_STOP=1 \
            -f supabase/migrations/20260902_001_production_cutover.sql

      - name: Validate secrets
        shell: bash
        run: |
          set -euo pipefail
          test -n "${SUPABASE_URL:-}"
          test -n "${SUPABASE_SECRET_KEY:-}"
          test -n "${TWELVE_DATA_API_KEY:-}"
          test -n "${WHATSAPP_NUMBER:-}"
          test -n "${CALLMEBOT_APIKEY:-}"

      - name: Run production alert cycle
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          from datetime import datetime, timezone

          from alert_platform.market_calendar import ExchangeMarketCalendar
          from alert_platform.provider_manager import ProviderManager
          from alert_platform.providers.twelve_data import TwelveDataProvider
          from alert_platform.providers.yahoo import YahooProvider
          from alert_platform.live_worker import run_live_cycle
          from alert_platform.supabase_repo import (
              SupabaseAlertRepository,
              SupabaseCreditBudget,
              SupabaseSettings,
          )
          from alert_platform.whatsapp import send_callmebot

          repo = SupabaseAlertRepository(
              SupabaseSettings(
                  os.environ['SUPABASE_URL'],
                  os.environ['SUPABASE_SECRET_KEY'],
              )
          )
          budget = SupabaseCreditBudget(repo, per_minute_limit=8, daily_budget=800)
          provider = ProviderManager(
              TwelveDataProvider(os.environ['TWELVE_DATA_API_KEY']),
              YahooProvider(),
              budget=budget,
          )
          result = run_live_cycle(
              repo, ExchangeMarketCalendar(refresh_delay_minutes=3), provider,
              lambda message: send_callmebot(
                  os.environ['WHATSAPP_NUMBER'], os.environ['CALLMEBOT_APIKEY'], message
              ),
              now=datetime.now(timezone.utc),
          )
          print(result)
          if result.errors:
              raise SystemExit(f"PRODUCTION_ALERT_ERRORS={result.errors}")
          print('PRODUCTION_ALERT_CYCLE_OK')
          PY

      - name: Publish cutover verification
        if: always() && github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create \
            --title "Alert cutover verification ${{ job.status }}" \
            --body "Workflow run: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}\nCommit: ${{ github.sha }}\nResult: ${{ job.status }}"

