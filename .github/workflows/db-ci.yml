name: DB CI

on:
  push:
    branches: [main]
    paths:
      - 'supabase/**'
      - '.github/workflows/db-ci.yml'
  pull_request:
    paths:
      - 'supabase/**'
      - '.github/workflows/db-ci.yml'
  workflow_dispatch:

jobs:
  postgres-tests:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: alert_platform_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d alert_platform_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: alert_platform_test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Seed Supabase roles
        run: |
          set -euo pipefail
          psql -v ON_ERROR_STOP=1 <<'SQL'
          DO $$ BEGIN
            IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname='anon') THEN CREATE ROLE anon NOLOGIN; END IF;
            IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname='authenticated') THEN CREATE ROLE authenticated NOLOGIN; END IF;
            IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname='service_role') THEN CREATE ROLE service_role NOLOGIN; END IF;
          END $$;
          SQL

      - name: Apply migrations
        run: |
          set -euo pipefail
          for file in $(find supabase/migrations -maxdepth 1 -type f -name '*.sql' | sort); do
            echo "Applying $file"
            psql -v ON_ERROR_STOP=1 -f "$file"
          done

      - name: Run database smoke tests
        run: |
          set -euo pipefail
          for file in $(find supabase/tests -maxdepth 1 -type f -name '*.sql' | sort); do
            echo "Running $file"
            psql -v ON_ERROR_STOP=1 -f "$file"
          done
